name: Part IV offline knowledge-base validation

on:
  pull_request:
    paths:
      - "part-iv/**"
      - ".github/workflows/part-iv-offline-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Run both offline SD-KDP implementation test sets
        run: |
          python -m pytest -q part-iv/tests/test_pipeline.py
          python -m pytest -q part-iv/tests/test_basics.py
      - name: Check reviewed-source inventory counts
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path("part-iv/corpus/sources.csv").open()))
          trusted=[r for r in rows if r["verdict"]=="trusted"]
          rejected=[r for r in rows if r["verdict"]=="rejected"]
          assert len(trusted)==17,(len(trusted), "trusted")
          assert len(rejected)==3,(len(rejected), "rejected")
          assert len(set(r["id"] for r in rows))==len(rows)
          print("CORPUS METADATA: 17 trusted, 3 rejected, unique IDs")
          print("NOTE: manifest counts are not a full-corpus collection, licensing, or voice-review check")
          PY
