[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-splitter"
version = "0.1.0"
description = "CLI tool that computes a minimal settlement for shared group expenses"
requires-python = ">=3.11"
# No runtime dependencies: standard library only (Constitution Principle I).
dependencies = []

[project.optional-dependencies]
# Development-only dependency; never imported by src/splitter/.
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Put src/ on the import path so `import splitter` works without installation.
pythonpath = ["src"]
testpaths = ["tests"]
